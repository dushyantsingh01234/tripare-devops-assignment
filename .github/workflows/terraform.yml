name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: fmt check
        run: terraform fmt -check -recursive infra

  plan:
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # Init without the S3 backend so PRs don't need AWS creds. Reviewers
      # get plan output; real applies happen from a protected job later.
      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate -no-color

      # No AWS creds on PR builds - set dummies so the provider initializes.
      # Plan may not resolve every data source, and that's expected without an
      # apply pipeline. The plan output still surfaces the diff we want to review.
      - name: plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          AWS_REGION: ap-south-1
        run: |
          set -o pipefail
          terraform plan \
            -input=false \
            -refresh=false \
            -lock=false \
            -var-file=terraform.tfvars \
            -out=tfplan.binary \
            -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            infra/envs/${{ matrix.env }}/plan.txt
            infra/envs/${{ matrix.env }}/tfplan.binary
          retention-days: 7

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/envs/${{ matrix.env }}/plan.txt';
            let body = '```\n(no plan output)\n```';
            if (fs.existsSync(path)) {
              let text = fs.readFileSync(path, 'utf8');
              const MAX = 60000;
              if (text.length > MAX) {
                text = text.slice(0, MAX) + '\n... [truncated, see artifact]';
              }
              body = '### terraform plan - `${{ matrix.env }}`\n```hcl\n' + text + '\n```';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### terraform plan - `${{ matrix.env }}`';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: mark job as failed if plan errored
        if: steps.plan.outcome == 'failure'
        run: |
          echo "terraform plan reported errors - see PR comment / artifact." >&2
          exit 1
